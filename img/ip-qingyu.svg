<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" width="480" height="420" role="img" aria-label="渔城青耘品牌吉祥物 青渔">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f8a52"/>
      <stop offset="0.55" stop-color="#1e6b3c"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfbf5"/>
      <stop offset="1" stop-color="#f1ead9"/>
    </linearGradient>
    <linearGradient id="hatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d9a4"/>
      <stop offset="1" stop-color="#e2bd78"/>
    </linearGradient>
    <linearGradient id="tailGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e6b3c"/>
      <stop offset="1" stop-color="#3d9a5f"/>
    </linearGradient>
  </defs>

  <!-- 底部浪花 -->
  <g fill="#dbeade" opacity="0.85">
    <ellipse cx="150" cy="392" rx="70" ry="14"/>
    <ellipse cx="250" cy="400" rx="90" ry="16"/>
    <ellipse cx="360" cy="390" rx="60" ry="12"/>
    <ellipse cx="95" cy="398" rx="40" ry="10"/>
  </g>

  <!-- 数据光点 -->
  <g fill="none" stroke-linecap="round">
    <circle cx="86" cy="140" r="7" fill="#e8862e" opacity="0.9"/>
    <path d="M86 132v-10M82 136l-9-5M90 136l9-5" stroke="#e8862e" stroke-width="2.5" opacity="0.7"/>
    <circle cx="420" cy="120" r="6" fill="#1e6b3c" opacity="0.85"/>
    <path d="M420 113v-9M416 117l-8-4M424 117l8-4" stroke="#1e6b3c" stroke-width="2.5" opacity="0.65"/>
    <circle cx="76" cy="262" r="5" fill="#e8b23a" opacity="0.85"/>
    <circle cx="402" cy="300" r="5" fill="#e8862e" opacity="0.8"/>
    <circle cx="120" cy="80" r="4" fill="#3d9a5f" opacity="0.8"/>
    <circle cx="392" cy="72" r="4" fill="#e8b23a" opacity="0.8"/>
  </g>

  <!-- 麦穗尾巴 -->
  <g>
    <path d="M330 218 Q392 190 416 224 Q396 238 352 234 Q392 256 404 292 Q370 300 344 282 Q356 312 340 330 Q318 316 330 286 Q310 262 322 246 Z"
          fill="url(#tailGrad)"/>
    <g fill="#e8b23a">
      <ellipse cx="384" cy="222" rx="10" ry="6" transform="rotate(-28 384 222)"/>
      <ellipse cx="400" cy="244" rx="10" ry="6" transform="rotate(-12 400 244)"/>
      <ellipse cx="396" cy="270" rx="10" ry="6" transform="rotate(10 396 270)"/>
      <ellipse cx="382" cy="294" rx="9" ry="5.5" transform="rotate(26 382 294)"/>
    </g>
  </g>

  <!-- 背鳍 -->
  <path d="M238 116 Q262 92 292 118 Q276 132 254 132 Z" fill="#e8862e" opacity="0.95"/>
  <path d="M266 122 Q278 108 292 120 Q282 130 268 130 Z" fill="#f2a45c" opacity="0.9"/>

  <!-- 鱼身 -->
  <ellipse cx="238" cy="236" rx="128" ry="118" fill="url(#bodyGrad)"/>
  <!-- 肚皮 -->
  <path d="M150 268 Q238 360 330 262 Q310 336 238 342 Q168 338 150 268 Z" fill="url(#bellyGrad)"/>
  <ellipse cx="238" cy="306" rx="82" ry="52" fill="url(#bellyGrad)"/>

  <!-- 侧鳍 -->
  <path d="M196 322 Q168 348 206 352 Q222 340 214 326 Z" fill="#e8862e"/>
  <path d="M286 318 Q312 342 276 350 Q262 338 270 324 Z" fill="#e8862e" opacity="0.92"/>

  <!-- 相机 -->
  <g>
    <rect x="206" y="242" width="64" height="44" rx="8" fill="#e8862e"/>
    <rect x="222" y="232" width="32" height="16" rx="4" fill="#c96a18"/>
    <rect x="212" y="250" width="30" height="28" rx="5" fill="#3a3f45"/>
    <circle cx="227" cy="264" r="10" fill="#20242a"/>
    <circle cx="227" cy="264" r="5.5" fill="#e8b23a"/>
    <circle cx="227" cy="264" r="2.5" fill="#fff" opacity="0.85"/>
    <circle cx="254" cy="252" r="4" fill="#ffd9a8" opacity="0.95"/>
    <path d="M216 262 q4 -3 8 0" stroke="#e8862e" stroke-width="2" fill="none" opacity="0.6"/>
  </g>

  <!-- 眼睛 -->
  <g>
    <ellipse cx="200" cy="196" rx="21" ry="24" fill="#ffffff"/>
    <ellipse cx="203" cy="199" rx="13.5" ry="16" fill="#22301f"/>
    <circle cx="208" cy="192" r="5" fill="#ffffff"/>
    <circle cx="198" cy="205" r="2.6" fill="#ffffff" opacity="0.7"/>
    <ellipse cx="274" cy="196" rx="21" ry="24" fill="#ffffff"/>
    <ellipse cx="271" cy="199" rx="13.5" ry="16" fill="#22301f"/>
    <circle cx="276" cy="192" r="5" fill="#ffffff"/>
    <circle cx="266" cy="205" r="2.6" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- 腮红 -->
  <ellipse cx="172" cy="238" rx="14" ry="9" fill="#f2a45c" opacity="0.55"/>
  <ellipse cx="302" cy="238" rx="14" ry="9" fill="#f2a45c" opacity="0.55"/>

  <!-- 嘴巴 -->
  <path d="M230 248 q6 8 14 0" stroke="#14532d" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- 草帽 -->
  <g>
    <ellipse cx="238" cy="138" rx="96" ry="22" fill="url(#hatGrad)"/>
    <path d="M178 138 Q180 100 238 96 Q296 100 298 138 Z" fill="url(#hatGrad)"/>
    <ellipse cx="238" cy="138" rx="96" ry="22" fill="none" stroke="#d8b066" stroke-width="3"/>
    <path d="M180 138 L178 118 M210 132 L208 108 M268 132 L270 108 M298 138 L300 118 M236 96 Q222 78 240 74 Q258 78 242 96 Z" stroke="#d8b066" stroke-width="2.5" fill="none" opacity="0.75"/>
    <rect x="168" y="134" width="140" height="10" rx="5" fill="#e8862e"/>
    <rect x="168" y="134" width="140" height="5" rx="2.5" fill="#f2a45c" opacity="0.6"/>
  </g>
</svg>
